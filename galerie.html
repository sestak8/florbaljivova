<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galerie – Florbalový turnaj Jívová</title>
  <meta name="description" content="Fotografie z florbalového turnaje v Jívové.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="index.html">Florbal <span>Jívová</span></a>
      <ul class="nav">
        <li><a href="index.html">Úvod</a></li>
        <li><a href="novinky.html">Novinky</a></li>
        <li><a href="historie.html">Historie</a></li>
        <li><a href="galerie.html" aria-current="page">Galerie</a></li>
        <li><a href="kontakt.html">Kontakt</a></li>
      </ul>
    </div>
  </header>

  <main>
    <div class="wrap">
      <h1>Galerie</h1>
      <p class="lead">Fotky z jednotlivých ročníků. Kliknutím fotku zvětšíte.</p>

      <!--
        Seznam fotek je v img/galerie.json (ročníky, soubory, popisky).
        Fotku z galerie odeberete smazáním jejího řádku v galerie.json.
      -->
      <div id="albums"><p class="muted">Načítám fotky…</p></div>
      <noscript><p>Pro zobrazení galerie je potřeba zapnutý JavaScript.</p></noscript>
    </div>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close" aria-label="Zavřít">×</button>
    <button class="prev" aria-label="Předchozí">‹</button>
    <img alt="">
    <button class="next" aria-label="Další">›</button>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <span>© 2026 Florbalový turnaj Jívová</span>
      <a href="https://www.jirisestak.com">jirisestak.com</a>
    </div>
  </footer>

  <script>
    (function () {
      const albums = document.getElementById('albums');

      function el(tag, attrs, children) {
        const e = document.createElement(tag);
        for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
        (children || []).forEach(c => e.append(c));
        return e;
      }

      // Vykreslení alb ze seznamu fotek
      fetch('img/galerie.json', { cache: 'no-cache' })
        .then(r => r.json())
        .then(data => {
          albums.textContent = '';
          const years = (data.years || []).filter(y => y.photos && y.photos.length)
            .sort((a, b) => b.year - a.year);
          if (!years.length) { albums.append(el('p', { class: 'muted' }, ['Zatím tu nejsou žádné fotky.'])); return; }

          years.forEach(y => {
            const heading = el('h2', {}, [String(y.year)]);
            if (y.title) heading.append(' ', el('small', {}, ['· ' + y.title]));
            const grid = el('div', { class: 'gallery' });
            y.photos.forEach(p => {
              grid.append(el('a', { href: `img/${y.year}/${p.file}` }, [
                el('img', { src: `img/${y.year}/nahledy/${p.file}`, alt: p.alt || `Fotka z roku ${y.year}`,
                            width: p.w || 600, height: p.h || 400, loading: 'lazy' })
              ]));
            });
            const section = el('section', { class: 'album' }, [heading, grid]);
            const authors = [...new Set(y.photos.map(p => p.by).filter(Boolean))];
            if (authors.length) section.append(el('p', { class: 'credit' }, ['Foto: ' + authors.join(', ')]));
            albums.append(section);
          });
        })
        .catch(() => { albums.textContent = 'Fotky se nepodařilo načíst. Zkuste stránku obnovit.'; });

      // Jednoduchá prohlížečka fotek
      const box = document.getElementById('lightbox');
      const img = box.querySelector('img');
      let links = [], i = 0;

      function show(n) {
        i = (n + links.length) % links.length;
        img.removeAttribute('src');
        img.src = links[i].href;
        img.alt = links[i].querySelector('img')?.alt || '';
        box.classList.add('open');
        box.setAttribute('aria-hidden', 'false');
      }
      function close() {
        box.classList.remove('open');
        box.setAttribute('aria-hidden', 'true');
      }

      albums.addEventListener('click', e => {
        const a = e.target.closest('.gallery a');
        if (!a) return;
        e.preventDefault();
        links = Array.from(albums.querySelectorAll('.gallery a'));
        show(links.indexOf(a));
      });
      box.querySelector('.close').addEventListener('click', close);
      box.querySelector('.prev').addEventListener('click', () => show(i - 1));
      box.querySelector('.next').addEventListener('click', () => show(i + 1));
      box.addEventListener('click', e => { if (e.target === box) close(); });
      document.addEventListener('keydown', e => {
        if (!box.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft') show(i - 1);
        if (e.key === 'ArrowRight') show(i + 1);
      });
    })();
  </script>
</body>
</html>
